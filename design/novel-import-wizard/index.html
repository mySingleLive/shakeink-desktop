<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>玄印写作 · 导入作品分步向导 · 审核稿</title>
<style>
@font-face{font-family:ReviewSans;src:url('../assets/NotoSansSC-Regular.ttf');font-display:swap}
*{box-sizing:border-box}body{margin:0;background:#eeefeb;color:#343832;font:13px/1.6 ReviewSans,-apple-system,'PingFang SC',sans-serif}
.review{max-width:1480px;margin:auto;padding:22px 28px}.head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}
.eyebrow{font-size:10px;letter-spacing:2px;color:#797e72}h1{margin:3px 0 4px;font-weight:500;font-size:22px}.head p{margin:0;color:#73796c;font-size:12px}
.pill{border:1px solid #cdd3c6;border-radius:30px;padding:6px 13px;font-size:11px;white-space:nowrap;background:#f7f8f4}
.tools{display:flex;flex-wrap:wrap;gap:10px 18px;padding:14px 0 16px;align-items:center}.tools label{display:flex;gap:8px;align-items:center;font-size:11px;color:#73796c}
.tools select,.tools button{font:inherit;color:#3b4435;border:1px solid #cdd2c6;border-radius:6px;background:#fafbf7;padding:5px 10px;min-height:32px}.tools button{cursor:pointer}
.frame-top{display:flex;justify-content:space-between;margin-bottom:8px;color:#73796c;font-size:10px;letter-spacing:1px}
iframe{display:block;border:1px solid #cbd0c4;border-radius:12px;width:100%;height:800px;background:#100d0c;box-shadow:0 16px 48px #3d473014}.frame-wrap{margin:auto;max-width:100%}
.foot{margin-top:12px;color:#7d8374;font-size:11px;display:flex;justify-content:space-between;gap:16px}.foot a{color:#59674e}
</style>
</head>
<body>
<main class="review">
 <header class="head"><div><div class="eyebrow">玄印写作 / PRODUCT DESIGN</div><h1>导入作品 · 分步向导</h1><p>审核稿。卷章、角色、场景、物品、世界观为合成示例；不读取本机文件，不调用模型。</p></div><span class="pill">待你审核 UI / UX</span></header>
 <div class="tools" aria-label="设计审核工具">
  <label>主题<select id="theme"><option value="ink">玄墨</option><option value="paper">宣纸</option></select></label>
  <label>跳到步骤<select id="step"></select></label>
  <label>窗口<select id="size"><option value="1280,800">1280 × 800</option><option value="900,680">900 × 680</option><option value="390,700">390 × 700</option></select></label>
  <label>示例场景<select id="scenario"><option value="normal">正常（含一项失败）</option><option value="nomodel">未配置模型</option><option value="nochapters">未识别到卷章</option><option value="conflict">校验发现矛盾</option><option value="broken">校验发现引用失效</option></select></label>
  <label><input type="checkbox" id="fail" checked> 模拟识别/导入失败</label>
  <button id="reset" type="button">重置</button>
 </div>
 <div class="frame-wrap"><div class="frame-top"><span>产品窗口 · 合成资料预览</span><span id="dim">1280 × 800</span></div><iframe title="导入向导预览" src="wizard.html"></iframe></div>
 <footer class="foot"><span>可从第一步逐步点击；"跳到步骤"直接查看某一屏，不代表前序已执行。</span><span><a href="../../docs/novel-import-wizard/02-product.md">产品文档</a> · <a href="../../docs/novel-import-wizard/03-ui-design.md">设计说明</a></span></footer>
</main>
<script>
const frame=document.querySelector('iframe'),$=id=>document.getElementById(id)
function send(type,extra={}){frame.contentWindow.postMessage({type,...extra},'*')}
function size(){const [w,h]=$('size').value.split(',').map(Number);document.querySelector('.frame-wrap').style.width=w+'px';frame.style.height=h+'px';$('dim').textContent=w+' × '+h}
$('theme').onchange=()=>send('theme',{theme:$('theme').value});$('size').onchange=size
$('step').onchange=()=>send('jump',{step:$('step').value});$('reset').onclick=()=>send('reset',{fail:$('fail').checked,scenario:$('scenario').value});$('scenario').onchange=$('reset').onclick
$('fail').onchange=()=>send('fail',{fail:$('fail').checked})
window.addEventListener('message',e=>{if(e.source!==frame.contentWindow)return;const d=e.data
 if(d?.type==='steps'){$('step').innerHTML=d.steps.map(s=>`<option value="${s.id}">${s.n}. ${s.title}</option>`).join('')}
 if(d?.type==='at')$('step').value=d.step})
frame.addEventListener('load',()=>{size();send('theme',{theme:$('theme').value});send('reset',{fail:$('fail').checked,scenario:$('scenario').value})})
</script>
</body></html>
