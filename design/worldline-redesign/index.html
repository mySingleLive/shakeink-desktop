<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>世界线改版设计稿 v8 · docs/577</title>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="views.css">
<link rel="stylesheet" href="chrome.css">
</head>
<body>
<div class="review" aria-label="评审工具条（只属于设计稿）">
  <b>评审 v8 · 风格 A · 颜色=类型 · 圆点大小=重要度</b>
  <button data-light-toggle>亮色主题</button>
  <span class="note">示例数据为虚构</span>
</div>
<main class="panel">
  <!-- Same header as ThemePanel / CharactersPanel: h2 text-lg font-medium + right-side status. -->
  <header class="panel-head">
    <h2>世界线</h2>
    <div class="meta"><span class="save-status"><i></i>已保存</span><span class="badge">v2</span>
      <button class="btn ghost" title="撤销上次规划修改">撤销上次规划修改</button></div>
  </header>
  <div class="bar" role="toolbar" aria-label="世界线工具栏">
    <div class="tb-group">
      <button class="btn icon ghost" id="treeToggle" aria-pressed="true" title="显示/隐藏事件目录" aria-label="显示或隐藏事件目录">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="12" height="10" rx="2"/><path d="M6 3v10"/></svg></button>
      <button class="btn">主世界线 <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l4 4 4-4"/></svg></button>
      <div class="seg" role="group" aria-label="视图">
        <button data-view="timeline">时间线</button>
        <button data-view="table" aria-pressed="true">事件表</button>
      </div>
    </div>
    <span class="sep"></span>
    <div class="tb-group">
      <div class="picker">
        <button class="btn" id="periodBtn" aria-haspopup="listbox" title="选择时期并定位"></button>
        <div class="pop" id="periodPop" role="listbox" aria-label="时期" hidden></div>
      </div>
      <button class="btn toggle-all" id="toggleAll" title="展开或收起全部事件卡片"></button>
      <div class="zoom" title="缩放时间轴间距（也可 Ctrl + 滚轮）">
        <button id="zoomOut" aria-label="缩小">−</button><span id="zoomVal"></span><button id="zoomIn" aria-label="放大">＋</button>
        <button id="zoomFit" aria-label="复位" style="width:auto;padding:0 6px;font-size:12px">复位</button>
      </div>
    </div>
    <span class="spacer"></span>
    <div class="search" id="searchBox" role="search">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>
      <input id="search" placeholder="搜索事件" aria-label="搜索事件（标题、内容、角色、类型）" title="匹配标题、内容、角色、类型" autocomplete="off">
      <span class="count" id="searchCount" aria-live="polite"></span>
      <button id="searchPrev" aria-label="上一个结果（Shift+Enter）">↑</button><button id="searchNext" aria-label="下一个结果（Enter）">↓</button>
      <button id="searchClear" aria-label="清除搜索">×</button>
      <kbd>⌘F</kbd>
    </div>
    <button class="chipbtn" id="pending" title="待定位事件"><span class="lbl">待定位</span><b>2</b></button>
    <button class="chipbtn zero" title="从视窗外延续的事件"><span class="lbl">延续事件</span><b>0</b></button>
    <button class="btn icon ghost" id="moreBtn" aria-haspopup="menu" aria-label="更多操作" title="更多"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="3.5" cy="8" r=".6"/><circle cx="8" cy="8" r=".6"/><circle cx="12.5" cy="8" r=".6"/></svg></button>
    <button class="btn primary"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3.5v9M3.5 8h9"/></svg>事件</button>
  </div>
  <div class="menu" id="menu" role="menu" hidden>
    <button>世界线设置</button><button>＋ 世界线</button><button>＋ 时期</button><button>时期列表（3）</button>
    <button>跨世界连接</button><button>单位与对应 · 时间基准</button><hr>
    <button>✓ 显示时期</button><button>✓ 显示角色变化</button>
  </div>
  <div class="toast" id="toast" hidden></div>
  <div class="status"><span id="range"></span><span id="count"></span>
    <span class="legend" id="legend" aria-label="事件类型（点击隐藏/显示，双击只看这一类）"></span></div>
  <div class="workspace" id="workspace">
  <nav class="tree" id="tree" aria-label="事件目录">
    <div class="tree-head"><b>事件目录</b><span id="treeInfo"></span></div>
    <div id="treeRows" role="tree"></div>
  </nav>
  <section class="table" id="tableView">
    <div class="scroller" id="scroller" title="Ctrl + 滚轮缩放时间轴间距">
      <div class="sticky-year" id="stickyYear"></div>
      <div class="rail" id="rail"></div>
      <div class="cards" id="cards"></div>
    </div>
  </section>
  <section class="canvas" id="timelineView" hidden>
    <div class="ruler" id="ruler"></div>
    <div class="grid" id="grid"></div>
    <div class="periods" id="periods"></div>
    <div class="lane" id="lane"></div>
    <div class="hint">单击卡片展开/收起 · ▾ 折叠子事件 · 双击编辑 · 拖空白平移 · Ctrl + 滚轮缩放</div>
    <div class="minimap" id="minimap" tabindex="0" role="slider" aria-label="全局缩略：点击或拖动移动视窗，← → 平移" title="点击跳转 · 拖动方框移动视窗"></div>
  </section>
  </div>
</main>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
