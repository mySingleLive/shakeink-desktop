 const tabs=['作品','设定','角色','正文','对话'].map((t,i)=>`<span class="${i===view?'on':''}">${t}</span>`).join('')
 let tree=treeRow({icon:'bulb',tone:'theme',label:'小说创作指引（0）',chev:false})
 if(view===0)tree+=WORKS.map(w=>workRows(w,opts)).join('')
 else tree+=WORKS.slice(0,4).map(w=>{
  const icon=w.ok?svg('folderOpen','ico'):faultIcon(color(w.reason),14,true)
  const head=`<div class="row" style="font-size:12px;font-weight:500;padding-left:6px"><span class="chev open">${svg('chev','')}</span><span class="tone-work" style="display:flex">${icon}</span><span class="label" ${w.ok?'':`style="color:${textColor(w.reason)}"`}>${w.title}</span>${w.ok?'':`<span class="more">${svg('chev','').replace(/<path[^>]*>/,'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>')}</span>`}</div>`
  const body=w.ok?['主题','文风','世界观'].map(l=>treeRow({icon:'settings',tone:'settings',label:l,depth:1})).join(''):`<div class="group-body"><div class="line">${REASONS[w.reason].title}，${REASONS[w.reason].hint}</div></div>`
  return `<div style="margin-bottom:10px">${head}${body}</div>`
 }).join('')
 return `<div class="sidebar"><div class="traffic"><i></i><i></i><i></i></div><div class="brand"><span class="seal">玄</span>玄印写作</div>
 <div class="create"><div>${svg('notebook','')}创建作品</div><div>${svg('import','')}导入作品</div><div>${svg('newChat','')}新对话</div></div>
 <div class="tabs">${tabs}</div><div class="tree">${tree}</div></div>`
}
function beforeSidebar(){
 const card=w=>`<div style="border:1px solid var(--border);border-radius:6px;padding:8px 0;margin:0 0 8px"><div style="display:flex;gap:8px;align-items:center;padding:0 12px;font-weight:500;font-size:14px"><span style="color:var(--destructive);display:flex">${svg('alert','',16)}</span>${w.title}</div><div style="display:flex;gap:8px;padding:6px 12px 0;font-size:12px;color:var(--muted-fg)"><span style="color:var(--destructive);display:flex">${svg('alert','',16)}</span>${w.reason==='stale-lease'?'上次异常退出留下了写入锁，作品内容已保留。':'作品目录暂不可用，请检查目录后重新加载。'}</div>${w.reason==='stale-lease'?'<div style="padding:8px 12px 0"><button class="btn" style="height:28px;font-size:12px">修复作品锁</button></div>':''}</div>`
 const s=sidebar(0,{})
 const faulted=WORKS.filter(w=>!w.ok)
 return s.replace(/<div class="tree">[\s\S]*<\/div><\/div>$/,`<div class="tree"><div style="padding:8px">${faulted.slice(0,2).map(card).join('')}<button class="btn" style="height:28px;font-size:12px;display:flex;align-items:center;gap:6px">${svg('refresh','',14)}重新加载作品</button></div>${WORKS.filter(w=>w.ok).map(w=>workRows({...w,open:false})).join('')}</div></div>`)
}
function render(){
 document.documentElement.className=state.theme
 const sc=state.scene,win=document.getElementById('win')
 const opts={}
 if(sc==='more'||sc==='hover'||sc==='context-lease'||sc==='context-ok')opts.focus={more:'w2',hover:'w2','context-lease':'w3','context-ok':'w6'}[sc]
 if(sc==='more')opts.moreOpen='w2'
 const view=sc==='settings-view'?1:0
 win.innerHTML=(sc==='before'?beforeSidebar():sidebar(view,opts))+`<div class="workspace">${sc==='before'?'当前实现：异常作品为卡片 + 全局按钮，与作品节点样式不一致':'工作区（与本设计无关）'}</div>`
 const W=win.getBoundingClientRect(),pos=id=>{const r=win.querySelector(`.row[data-id="${id}"]`)?.getBoundingClientRect();return r&&{left:r.left-W.left,top:r.top-W.top,right:r.right-W.left,bottom:r.bottom-W.top}}
 let extra=''
 if(sc==='more'){const p=pos('w2');extra=menuFor(byId('w2'),{x:p.right-30,y:p.bottom+2,focus:0})}
 if(sc==='context-lease'){const p=pos('w3');extra=menuFor(byId('w3'),{x:118,y:p.top+16,focus:0})+cursor(114,p.top+12)}
 if(sc==='context-ok'){const p=pos('w6');extra=menuFor(byId('w6'),{x:100,y:p.top+16,focus:-1})+cursor(96,p.top+12)}
 if(sc==='repairing'){const p=pos('w3');extra=menuFor(byId('w3'),{x:p.right-30,y:p.bottom+2,focus:-1,busy:true})}
 if(sc==='hover'){const p=pos('w2');extra=hoverCard(byId('w2'),{x:p.right+8,y:p.top})}
 if(sc==='delete')extra=deleteDialog(byId('w2'))
 if(sc==='delete-lease')extra=deleteDialog(byId('w3'))
 if(sc==='delete-busy')extra=deleteDialog(byId('w2'),'busy')
 if(sc==='delete-error')extra=deleteDialog(byId('w2'),'error')
 win.insertAdjacentHTML('beforeend',extra)
 // Same collision rule as the product popup: flip above the anchor when clipped.
 for(const el of win.querySelectorAll('.menu,.card')){const r=el.getBoundingClientRect();if(r.bottom>W.bottom-8)el.style.top=Math.max(8,parseFloat(el.style.top)-r.height-(el.classList.contains('card')?-28:34))+'px'}
 renderControls();renderSpec();renderNotes()
}
const cursor=(x,y)=>`<svg class="cursor" style="left:${x}px;top:${y}px" viewBox="0 0 14 20"><path d="M1 1v16l4.2-4 2.8 6 2.4-1.1-2.8-5.9H13Z" fill="#fff" stroke="#000" stroke-width="1"/></svg>`
function seg(id,list,key){
 document.getElementById(id).innerHTML=list.map(([v,l])=>`<button aria-pressed="${state[key]===v}" data-v="${v}">${l}</button>`).join('')
 document.getElementById(id).onclick=e=>{const v=e.target.dataset.v;if(v){state[key]=v;render()}}
}
function renderControls(){
 seg('theme',[['ink','玄墨'],['paper','宣纸']],'theme')
 seg('scheme',[['split','A：错误红 / 锁类琥珀'],['red','B：全部红色']],'scheme')
 seg('scene',SCENES,'scene')
}
function renderSpec(){
 const big=s=>[faultIcon('var(--destructive)',s),faultIcon('var(--warning)',s)].join('')
 document.getElementById('spec').innerHTML=`
 <figure><div class="sizes">${svg('folder','ico',14)}${faultIcon(color('missing'),14)}${faultIcon(color('stale-lease'),14)}</div>实际尺寸 14px：正常 / 错误 / 锁类</figure>
 <figure><div class="sizes">${svg('folder','ico',48)}${faultIcon(color('missing'),48)}${faultIcon(color('stale-lease'),48)}</div>放大 48px</figure>
 <figure><div class="sizes">${faultIcon(color('missing'),48,true)}</div>其他视图展开态</figure>
 <figure style="align-items:flex-start;max-width:300px;line-height:1.6">标题文字：错误 玄墨 <code>#e08a80</code> / 宣纸 <code>#a3463c</code>，警告 玄墨 <code>#d9b45f</code> / 宣纸 <code>#7e621c</code>；对侧栏底色对比度均 ≥ 4.5。<br>构成：lucide FolderClosed（作品色 <code>--icon-work</code>）右下角挖空 r=7.2，叠加 r=5.6 实心圆徽标 + 反色感叹号。徽标在 14px 下约 7px，与文件夹轮廓间留 1.6px 缝隙。</figure>`
}
const NOTES={
 overview:'作品视图。异常作品与正常作品使用同一行组件（高度 28px、缩进、字号相同），只是图标换成合成图标、标题文字改用柔和的红色（错误）或黄色（警告）、没有展开箭头（无可显示子树）。原来的卡片和全局“重新加载作品”按钮移除。',
 more:'悬停或聚焦时出现 <code>…</code>。异常作品单击整行也打开此菜单（没有作品 tab 可打开）。菜单顶部灰色标签显示异常类别，删除始终在分隔线后。',
 'context-lease':'右键与 <code>…</code> 是同一份菜单。作品锁类排在首位的是“修复作品锁”，它会打开现有原生流程的确认框并重启应用。',
 'context-ok':'正常作品的菜单内容与现在完全相同（重命名、删除，顺序和样式不变）。本场景只展示一个待确认的新入口：在正常作品节点上右键也能打开这份菜单。',
 hover:'悬停卡片替代原卡片里的说明文字：异常类别、原因、建议。不显示路径或原始错误。',
 delete:'删除 = 从作品列表移除并删除关联对话；不读写、不删除目录内任何文件。任何异常类型都可以删除，服务端不再以“作品可打开”为由拒绝。',
 'delete-lease':'作品锁类额外提示：删除后修复入口消失，重新打开该目录会被锁拒绝，因此建议先修复。',
 'delete-busy':'删除进行中：两个按钮禁用，对话框不可关闭；该作品的菜单项全部禁用。',
 'delete-error':'失败时对话框保持打开，在对话框内显示安全文案，可再次确认。成功后关闭对话框、关闭该作品的 tab、刷新作品与对话列表，并提示“作品已从列表中删除”。',
 repairing:'修复作品锁进行中：菜单内所有项禁用（含删除），首项显示进度文案。修复期间不允许删除，删除期间也不允许修复和重新加载。',
 'settings-view':'设定、角色、正文、对话视图：分组标题使用同一合成图标（展开态），标题右侧有同一份 <code>…</code> 菜单并支持右键，组内一行说明代替原卡片。',
 before:'当前实现（对照）：卡片 + 全局“重新加载作品”按钮，没有删除入口，与作品节点样式不一致。',
}
function renderNotes(){
 document.getElementById('notes').innerHTML=`<h3>本场景</h3><p>${NOTES[state.scene]}</p>
 <h3>异常分类与菜单</h3><ul>
 <li><b>目录缺失</b>（错误）：重新加载作品 · 删除</li>
 <li><b>目录已变化</b>（错误）：重新加载作品 · 删除</li>
 <li><b>数据无法读取</b>（错误）：重新加载作品 · 删除</li>
 <li><b>作品锁未释放</b>（锁类）：修复作品锁 · 重新加载作品 · 删除</li>
 <li><b>正在别处使用</b>（锁类）：重新加载作品 · 删除</li>
 <li>其他未识别原因按“作品不可用”（错误）处理</li></ul>
 <h3>需要你决定</h3><ul>
 <li>图标配色：方案 A（锁类琥珀）或方案 B（全部红色）</li>
 <li>正常作品节点是否也可右键打开菜单（菜单内容保持不变，本稿默认加）</li>
 <li>异常作品单击整行打开菜单（本稿默认如此）</li></ul>
 <h3>不在本次范围</h3><ul><li>重新关联目录、在访达中显示：需要新的授权流程或对缺失目录无意义</li></ul>`
}
render()
</script>
</body>
</html>
